name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Does our SHIPPED code run on the floor `engines` claims? A separate job rather than a second
  # matrix dimension, for two reasons found the hard way:
  #
  # 1. `pnpm` CANNOT RUN ON NODE 20 AT ALL. pnpm@11 imports `node:sqlite`, which does not exist
  #    before Node 22, so it dies during `pnpm/action-setup` — before any of our code is reached.
  #    That makes `pnpm verify` unusable here, so this job installs under 22 and then switches the
  #    runtime to 20 for the checks that are actually about our code. It is a real constraint of the
  #    toolchain, not of the product: nobody installing `lum` uses pnpm.
  #
  # 2. It used to be true that doubling the matrix broke `layer C`, and that was the second reason
  #    this is one job rather than a matrix dimension. THAT CONSTRAINT IS GONE: layer C now
  #    calibrates its ceiling against the same run's own bare-`node` p95 instead of a flat 150ms, so
  #    runner contention moves both terms together and cancels. A performance gate dictating how much
  #    of the shipped product gets tested was the tail wagging the dog, and it no longer does.
  #
  #    Kept as a separate job anyway, now purely for reason 1 — pnpm cannot start on Node 20, so the
  #    install and the run need different interpreters, which a matrix dimension cannot express.
  #
  # Typecheck and tests only. Lint and build run dev tools whose own Node support is not a promise
  # this project makes to anyone.
  node20-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BUILD UNDER 22, TEST UNDER 20 — and the build must happen here, before the switch.
      #
      # Two reasons. The bundler runs under the toolchain, like every other leg. And the thing a
      # Node 20 user actually executes is `dist/daycap.js`, so a compat job that never builds is
      # testing source it will never run. That gap was not theoretical: the symlink and
      # version gates in bin.test.ts both failed here with "Cannot find module dist/daycap.js"
      # while passing on all three `pnpm verify` legs, which build as part of verify.
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --version
      # Invoked directly rather than through `pnpm run`, because pnpm is the thing that cannot start.
      - run: npx tsc --noEmit
      - run: npx vitest run
