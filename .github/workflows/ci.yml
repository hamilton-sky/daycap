name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Both ends of the supported range, because `engines` is a PROMISE and an untested promise
        # is a guess. 20 is maintenance LTS and is the floor package.json now claims; 22 is what
        # every previous run used. Six jobs, and the cheap ones finish in ~25s.
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
